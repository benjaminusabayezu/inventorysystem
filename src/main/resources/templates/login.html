<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="login-body">
<div class="login-card">
    <div class="login-header">
        <div class="login-logo">A</div>
        <h1>Airtel Rwanda</h1>
        <p>Device Inventory Management System</p>
    </div>
    <div class="login-form">
        <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required autofocus/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required/>
            </div>
            <button type="submit" class="btn-primary full-width">Sign In</button>
        </form>
        <p class="login-hint">Default: admin / admin123</p>
    </div>
</div>
</body>
</html>
