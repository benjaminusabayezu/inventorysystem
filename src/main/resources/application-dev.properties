# =============================================
# DEV profile - H2 local database
# =============================================

# AUTO_SERVER=TRUE allows multiple connections without file locking
# Do NOT combine with DB_CLOSE_ON_EXIT=FALSE (unsupported in H2 2.2+)
spring.datasource.url=jdbc:h2:file:./data/inventory;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=airtel
spring.datasource.password=airtel2024

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000