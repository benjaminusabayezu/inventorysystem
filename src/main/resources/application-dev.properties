# =============================================
# DEV profile - Local PostgreSQL
# =============================================

# Local PostgreSQL (no more H2 file locking issues)
spring.datasource.url=jdbc:postgresql://localhost:5432/airtel_inventory
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=airtel
spring.datasource.password=airtel2024

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# H2 console disabled (using PostgreSQL now)
spring.h2.console.enabled=false